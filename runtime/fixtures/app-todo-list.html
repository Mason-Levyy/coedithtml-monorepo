<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Todo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 2rem;
        max-width: 400px;
      }
      li {
        padding: 0.25rem 0;
      }
    </style>
  </head>
  <body>
    <div class="new-item">
      <input type="text" placeholder="Add a task" />
      <button>Add</button>
    </div>
    <ul id="items">
      <li><input type="checkbox" /> Renew the domain</li>
      <li><input type="checkbox" checked /> Reply to the pilot customer</li>
      <li><input type="checkbox" /> Write the release notes</li>
    </ul>
  </body>
</html>
