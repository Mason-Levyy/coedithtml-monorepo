<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ops Dashboard</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 2rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
      }
      .widget {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Ops Dashboard</h1>
    <div class="grid">
      <div class="widget">
        <strong>Requests / min</strong>
        <p>12,400</p>
      </div>
      <div class="widget">
        <strong>Error rate</strong>
        <p>0.02%</p>
      </div>
      <div class="widget">
        <strong>p99 latency</strong>
        <p>84ms</p>
      </div>
      <div class="widget">
        <strong>Active workers</strong>
        <p>18</p>
      </div>
      <div class="widget">
        <strong>Queue depth</strong>
        <p>3</p>
      </div>
      <div class="widget">
        <strong>Uptime</strong>
        <p>99.98%</p>
      </div>
    </div>
  </body>
</html>
