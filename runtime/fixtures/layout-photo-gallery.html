<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trip to the Coast</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 2rem;
      }
      figure {
        margin: 0 0 1rem;
      }
    </style>
  </head>
  <body>
    <figure data-test-height="200">
      <img src="1.jpg" alt="Tide pools at low tide" />
      <figcaption>Tide pools, day one</figcaption>
    </figure>
    <figure data-test-height="200">
      <img src="2.jpg" alt="Sunset over the cliffs" />
      <figcaption>Sunset from the cliff trail</figcaption>
    </figure>
    <figure data-test-height="200">
      <img src="3.jpg" alt="Fishing boats in harbor" />
      <figcaption>The harbor at dawn</figcaption>
    </figure>
    <figure data-test-height="200">
      <img src="4.jpg" alt="Seagulls on a pier" />
      <figcaption>Regulars at the pier</figcaption>
    </figure>
    <figure data-test-height="200">
      <img src="5.jpg" alt="Lighthouse on a point" />
      <figcaption>The old lighthouse</figcaption>
    </figure>
    <figure data-test-height="200">
      <img src="6.jpg" alt="Waves against rocks" />
      <figcaption>Low tide, second day</figcaption>
    </figure>
    <figure data-test-height="200">
      <img src="7.jpg" alt="Driftwood on sand" />
      <figcaption>Driftwood pile</figcaption>
    </figure>
    <figure data-test-height="200">
      <img src="8.jpg" alt="Path through dunes" />
      <figcaption>The dune path</figcaption>
    </figure>
    <figure data-test-height="200">
      <img src="9.jpg" alt="Coastal town at dusk" />
      <figcaption>Last night in town</figcaption>
    </figure>
  </body>
</html>
