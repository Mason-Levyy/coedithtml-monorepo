    <h3>The cell membrane</h3>
    <p>A phospholipid bilayer that controls what enters and leaves the cell.</p>
    <h3>Mitochondria</h3>
    <p>Produce ATP through cellular respiration; have their own DNA.</p>
    <h3>The nucleus</h3>
    <p>Houses chromosomal DNA and controls gene expression.</p>
    <h3>Ribosomes</h3>
    <p>Synthesize proteins by translating mRNA sequences.</p>
