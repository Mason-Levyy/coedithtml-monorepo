<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Color Mixer</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 2rem;
        max-width: 320px;
      }
      .swatch {
        width: 100%;
        height: 120px;
        border-radius: 8px;
        margin-bottom: 1rem;
        background: #7c3aed;
      }
      .slider-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="swatch" id="swatch"></div>
    <div class="slider-row">
      <label>R</label><input type="range" min="0" max="255" value="124" />
    </div>
    <div class="slider-row">
      <label>G</label><input type="range" min="0" max="255" value="58" />
    </div>
    <div class="slider-row">
      <label>B</label><input type="range" min="0" max="255" value="237" />
    </div>
  </body>
</html>
