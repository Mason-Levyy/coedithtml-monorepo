name: Deploy

# Deploys production on every push to main, after the same checks CI runs.
# Needs two repo secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push waits for the running deploy instead of
# cancelling it halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build (assembles worker/public, which the worker tests load)
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Runtime bundle size budget
        run: pnpm --filter runtime run check-size

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
            exit 1
          fi

      # The root "deploy" script: build, then wrangler deploy --env production.
      # `pnpm run` is needed because bare `pnpm deploy` is pnpm's own command.
      - name: Deploy the app worker
        run: pnpm run deploy

      - name: Deploy the marketing site
        run: pnpm --filter @coedithtml/website run deploy
